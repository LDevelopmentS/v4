<main class="stage">
  <section class="pane">
    <h1 class="pane__title">Excellence xString</h1>
    <p class="sub">Fill in the subject panel and generate. Blank fields are skipped automatically.</p>

    <div class="xs">
      <!-- Subject panel -->
      <div class="xs__form">
        <div class="field-section">
          <h3>Identity</h3>
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" placeholder="e.g. Jordan Alex Rivera">
            <label class="toggle-row" for="mergeLastName">
              <input type="checkbox" id="mergeLastName">
              <span class="toggle-switch"></span>
              <span>Middle and Last as Last name</span>
            </label>
          </div>
          <div class="field" id="nameVariantField" hidden>
            <label>Name combinations <span class="date-hint">— uncheck any to exclude</span></label>
            <div id="nameVariantList" class="variant-list"></div>
          </div>
          <div class="field">
            <label>Date(s) of birth <span class="date-hint">— paste as MM/DD/YYYY; use XX or XXXX for an unknown part</span></label>
            <div id="dobRows"></div>
            <button type="button" class="add-link" id="addDob">+ Add another date of birth</button>
          </div>
        </div>

        <div class="field-section">
          <h3>Date(s) of loss</h3>
          <div class="field">
            <div id="dolRows"></div>
            <button type="button" class="add-link" id="addDol">+ Add another date of loss</button>
          </div>
        </div>

        <div class="field-section">
          <h3>Location</h3>
          <div class="field">
            <div id="locationRows"></div>
            <button type="button" class="add-link" id="addLocation">+ Add another city / state</button>
          </div>
        </div>

        <div class="field-section">
          <h3>Contact</h3>
          <div class="field">
            <label>Phone number(s)</label>
            <div id="phoneRows"></div>
            <button type="button" class="add-link" id="addPhone">+ Add another phone number</button>
          </div>
          <div class="field">
            <label>Email address(es)</label>
            <div id="emailRows"></div>
            <button type="button" class="add-link" id="addEmail">+ Add another email</button>
          </div>
        </div>

        <div class="field-section">
          <h3>Alias / nickname</h3>
          <div class="field">
            <div id="aliasRows"></div>
            <button type="button" class="add-link" id="addAlias">+ Add another alias / nickname</button>
          </div>
        </div>

        <div class="field-section">
          <h3>Background</h3>
          <div class="field">
            <label>Employment</label>
            <div id="employmentRows"></div>
            <button type="button" class="add-link" id="addEmployment">+ Add another employer</button>
          </div>
          <div class="field">
            <label>School</label>
            <div id="schoolRows"></div>
            <button type="button" class="add-link" id="addSchool">+ Add another school</button>
          </div>
        </div>

        <div class="region-switch" id="googleRegionSwitch">
          <span class="region-label">Google</span>
          <label><input type="radio" name="googleRegion" value="US" checked> US (.com)</label>
          <label><input type="radio" name="googleRegion" value="CA"> CA (.ca)</label>
        </div>

        <div class="xs__footer">
          <div class="xs__actions">
            <button type="button" class="btn primary" id="generateBtn">Generate</button>
            <button type="button" class="btn" id="clearGenBtn">Clear</button>
            <button type="button" class="btn" id="saveStateBtn">Save to file</button>
            <button type="button" class="btn" id="loadStateBtn">Load from file</button>
          </div>
          <input type="file" id="loadStateInput" accept=".html,.htm,.json,text/html,application/json" hidden>
        </div>
      </div>

      <!-- Results -->
      <div class="xs__results">
        <div id="results"></div>
      </div>
    </div>
  </section>
</main>
