<!-- Findings (Progressive report only). Bound to $store.form.progFinding; shown by the `show` rule in js/config/sections.js. -->
<div class="stack">
  <fieldset class="fieldset">
    <legend>Findings</legend>
    <div class="choice-group">
      <label class="choice"><input type="radio" name="prog-finding" value="none" x-model="$store.form.progFinding"> No findings found</label>
      <label class="choice"><input type="radio" name="prog-finding" value="relevant" x-model="$store.form.progFinding"> Findings</label>
    </div>
    <textarea class="input" placeholder="Enter findings or text details here..." x-model="$store.form.progFindingText"></textarea>
  </fieldset>
</div>
